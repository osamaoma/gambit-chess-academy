# Render Blueprint — deploys Gambit Chess Academy automatically.
# Once your repo is connected to Render, this file is auto-detected.
# See: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: gambit-chess-academy
    runtime: node
    plan: free                       # change to "starter" ($7/mo) to avoid the spin-down delay
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status     # Render polls this to confirm the service is alive
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"                  # Node 20 LTS (18 is end-of-life)
      # Optional: a free Lichess API token enables the Opening Explorer for all
      # users without per-user setup. Create one (no scopes needed) at
      # https://lichess.org/account/oauth/token/create and set it in the Render
      # dashboard → Environment, or uncomment below and use a secret.
      # - key: LICHESS_TOKEN
      #   sync: false
    autoDeploy: true                 # redeploy on every git push to main
